# /usr/lib/systemd/system/mdadm-last-resort@.timer.d/amdraid.conf, in the
# real root and in the initramfs.  The root volume usually starts before the
# last-resort timer of its container runs out.  Then the initramfs isolates
# initrd-switch-root.target and the real root starts default.target the same
# way, and either stops every unit without IgnoreOnIsolate: the timer would be
# gone, and another volume of the container, one the boot does not wait for,
# would never be started.  Keep the timer, as mdmon@ is kept, to run out in the
# real root.
[Unit]
IgnoreOnIsolate=true
