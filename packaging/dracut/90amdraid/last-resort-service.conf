# /usr/lib/systemd/system/mdadm-last-resort@.service.d/amdraid.conf, in the
# real root and in the initramfs, with the timer's drop-in: a "mdadm --run"
# still running when the root comes up is kept as well (it may not have
# started every volume yet), and the initramfs waits for it before it stops
# udev.  A oneshot service has no start timeout: give it one, so that the boot
# never waits for it forever.
[Unit]
IgnoreOnIsolate=true
Before=initrd-cleanup.service initrd-switch-root.target

[Service]
TimeoutStartSec=90s
