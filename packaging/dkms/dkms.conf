# md_mod with the write-intent bitmap fix for external metadata (kernel/0001, kernel/0002).
# The sources are drivers/md of a few stable kernels (bases, one directory each); the file
# "bases" tells which kernel versions have the same drivers/md as each, and
# dkms-pre-build.sh takes the one of the target kernel.  Any other kernel is skipped and
# keeps its own md_mod.
PACKAGE_NAME="md-bitmap-ext"
PACKAGE_VERSION="@PKGVER@"
BUILD_EXCLUSIVE_KERNEL="@KVER_RE@"
PRE_BUILD="dkms-pre-build.sh ${kernel_source_dir} ${kernelver}"
# DKMS moves the kernel's own md-mod.ko away as it installs ours; put it back (ours still
# wins: depmod takes updates/ first), so that the kernel package has all its files
POST_INSTALL="dkms-post-install.sh ${dkms_tree} ${PACKAGE_NAME} ${kernelver} ${arch}"
# clang-built kernels (CachyOS: ThinLTO) need the same toolchain for modules
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build $(grep -qs '^CONFIG_CC_IS_CLANG=y' ${kernel_source_dir}/.config && echo LLVM=1 || :) modules"
# Only md_mod changes; raid0/raid1/raid10/raid456 of the kernel keep working with it
# (no change to md.h or to exported symbols).
BUILT_MODULE_NAME[0]="md-mod"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
